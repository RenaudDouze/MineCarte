name: Déploiement du worker de synchronisation

on:
  # Après une CI verte sur main (le code du worker y est testé à 100 % de
  # couverture et de mutation), et seulement si le worker a changé.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # Commit de fusion sur main : on compare à son premier parent.
      - name: Worker modifié ?
        id: changed
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$MANUAL" = "true" ] || ! git diff --quiet HEAD~1 HEAD -- . ../.github/workflows/worker-deploy.yml; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Worker inchangé : pas de déploiement."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.deploy == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # Wrangler 4 depuis package-lock.json : même version en CI qu'en local.
      - name: Dépendances
        if: steps.changed.outputs.deploy == 'true'
        run: npm ci

      # Configuration par variables et secrets du dépôt (voir worker/README.md).
      # S'il en manque, on ne déploie pas.
      - name: Configurer
        if: steps.changed.outputs.deploy == 'true'
        id: config
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          KV_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : worker non déployé."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif ! [[ "$KV_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::warning::Variable CLOUDFLARE_KV_NAMESPACE_ID absente ou invalide (32 caractères hexadécimaux) : worker non déployé."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            sed -i "s/__CLOUDFLARE_KV_NAMESPACE_ID__/$KV_ID/" wrangler.toml
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Déployer
        id: wrangler
        if: steps.config.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      - name: URL du worker
        if: steps.config.outputs.deploy == 'true'
        env:
          URL: ${{ steps.wrangler.outputs.deployment-url }}
        run: |
          echo "Worker déployé : $URL"
          echo "### Worker déployé : $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "À renseigner dans la variable de dépôt SYNC_WORKER_URL (sans slash final)." >> "$GITHUB_STEP_SUMMARY"

      - name: Vérification après déploiement
        if: steps.config.outputs.deploy == 'true' && vars.SYNC_WORKER_URL != ''
        env:
          SYNC_WORKER_URL: ${{ vars.SYNC_WORKER_URL }}
        run: |
          # 404 attendu : code valide mais jamais attribué (lecture seule, aucune écriture KV).
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$SYNC_WORKER_URL/api/sync/AAAAAAAA")
          if [ "$code" != "404" ]; then
            echo "::error::Le worker répond $code au lieu de 404."
            exit 1
          fi
