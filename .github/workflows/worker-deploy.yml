name: Déploiement du worker de synchronisation

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/workflows/worker-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node --test

      # Sans secrets Cloudflare (voir worker/README.md), on s'arrête après les tests.
      - name: Vérifier la configuration
        id: config
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : worker non déployé."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif grep -q REMPLACER_PAR_L_ID_DU_NAMESPACE wrangler.toml; then
            echo "::warning::L'id du namespace KV n'est pas renseigné dans worker/wrangler.toml : worker non déployé."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Déployer
        if: steps.config.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      - name: Vérification après déploiement
        if: steps.config.outputs.deploy == 'true' && vars.SYNC_WORKER_URL != ''
        env:
          SYNC_WORKER_URL: ${{ vars.SYNC_WORKER_URL }}
        run: |
          # 404 attendu : code valide mais jamais attribué (lecture seule, aucune écriture KV).
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$SYNC_WORKER_URL/api/sync/AAAAAAAA")
          if [ "$code" != "404" ]; then
            echo "::error::Le worker répond $code au lieu de 404."
            exit 1
          fi
